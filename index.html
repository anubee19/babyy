
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Shikha 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(
        135deg,
        #f8d8e5,
        #ffcedb,
        #f9b6cb,
        #ffe0e5
    );
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -50px;
    color: #f04478;
    pointer-events: none;
    z-index: 0;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.8; }
    100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
    }
}

/* Main layout */
.container {
    width: 100%;
    max-width: 650px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 35px;
}

/* Invitation envelope */
.invitation {
    position: relative;
    width: min(90%, 480px);
    min-height: 245px;
    background: #fff0e9;
    border: 2px solid #f4b9b7;
    border-radius: 8px;
    box-shadow: 0 15px 35px #b94e6c33;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    text-align: center;
    animation: appear 1s ease;
}

.invitation::before {
    content: "♡";
    position: absolute;
    top: 10px;
    right: 20px;
    color: #ed477c;
    font-size: 25px;
}

.invitation::after {
    content: "♥";
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    color: #d92760;
    font-size: 42px;
    text-shadow: 0 3px 5px #b94e6c33;
}

.ribbon {
    position: absolute;
    top: 12px;
    left: -12px;
    width: 65px;
    height: 23px;
    background: #dc174d;
    border-radius: 50% 10% 10% 50%;
    transform: rotate(-30deg);
    box-shadow: 0 3px 6px #a51a4533;
}

.ribbon::after {
    content: "";
    position: absolute;
    left: 25px;
    top: 10px;
    width: 20px;
    height: 65px;
    background: #dc174d;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
}

.invitation h1 {
    color: #bd245a;
    font-size: clamp(27px, 6vw, 40px);
    font-style: italic;
    margin: 12px 0;
    text-shadow: 0 1px 1px #f4a8bd;
}

.invitation p {
    color: #a83c61;
    font-size: 16px;
    font-style: italic;
    margin: 5px 0 22px;
}

/* Open button */
button {
    border: 1px solid #b61c51;
    border-radius: 35px;
    background: linear-gradient(135deg, #e92765, #bd1451);
    color: white;
    padding: 13px 27px;
    font-family: Georgia, serif;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 15px #bd145144;
    transition: transform 0.3s;
}

button:hover {
    transform: scale(1.07);
}

/* Letter paper */
.letter {
    display: none;
    position: relative;
    width: min(94%, 480px);
    min-height: 530px;
    padding: 35px 20px;
    text-align: center;
    background:
        linear-gradient(
            rgba(255, 250, 244, 0.96),
            rgba(255, 247, 239, 0.96)
        );
    border: 2px solid #f3b6ae;
    box-shadow:
        0 12px 30px #b94e6c33,
        inset 0 0 25px #f6d8c955;
    animation: openLetter 1s ease forwards;
}

.letter::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid #f3c4b9;
    pointer-events: none;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes openLetter {
    from {
        opacity: 0;
        transform: scale(.6) rotateY(90deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotateY(0);
    }
}

/* Kiss */
.kiss {
    font-size: 55px;
    margin: 0 0 15px;
    animation: kiss 1.2s ease;
}

@keyframes kiss {
    0% {
        transform: scale(0) rotate(-30deg);
        opacity: 0;
    }
    60% {
        transform: scale(1.5) rotate(15deg);
        opacity: 1;
    }
    100% {
        transform: scale(1) rotate(0);
    }
}

/* Photo */
.love-photo {
    display: block;
    width: 180px;
    height: 180px;
    max-width: 60vw;
    max-height: 60vw;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #f4a6b9;
    padding: 3px;
    background: white;
    box-shadow: 0 5px 15px #bc477044;
    margin: 10px auto 25px;
}

/* Message */
.message {
    color: #b51c55;
    font-size: clamp(25px, 6vw, 37px);
    font-style: italic;
    font-weight: normal;
    line-height: 1.4;
    margin: 12px 0;
    text-shadow: 0 1px 1px #f8c5d2;
}

.subtitle {
    color: #bd245a;
    font-size: clamp(21px, 5vw, 28px);
    font-style: italic;
    line-height: 1.5;
    margin: 10px 0 20px;
}

.divider {
    color: #df386e;
    font-size: 23px;
    margin: 12px 0;
}

/* Nazar */
.nazar {
    display: inline-block;
    font-size: 43px;
    margin-top: 5px;
    animation: glow 2s infinite ease-in-out;
}

@keyframes glow {
    0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 0 transparent);
    }
    50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 8px #6db8e8);
    }
}

/* Music player */
.music {
    display: none;
    width: min(280px, 85vw);
    margin: 5px auto 0;
    accent-color: #dc3674;
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 20px 8px;
    }

    .container {
        gap: 30px;
    }

    .letter {
        min-height: 480px;
        padding: 30px 15px;
    }

    .love-photo {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Invitation -->
    <div class="invitation" id="invitation">
        <div class="ribbon"></div>

        <div style="font-size: 48px;">💌</div>

        <h1>A Special Invitation</h1>

        <p>A little surprise, made just for you</p>

        <button onclick="openLetter()">
            Open Invitation ♥
        </button>
    </div>

    <!-- Romantic letter -->
    <div class="letter" id="letter">

        <div class="kiss">💋</div>

        <!-- Replace photo.jpg with your picture -->
        <img
            src="photo.jpg"
            alt="Our picture"
            class="love-photo"
        >

        <h2 class="message">
            I lovee youu Shikha...
        </h2>

        <div class="divider">──── ♥ ────</div>

        <p class="subtitle">
            Youre my whole world
        </p>

        <div class="divider">♡</div>

        <div class="nazar">🧿</div>

    </div>

    <!-- Song -->
    <audio id="loveSong" src="song.mp3" loop></audio>

</div>

<script>
function openLetter() {
    document.getElementById("invitation").style.display = "none";

    document.getElementById("letter").style.display = "block";

    const song = document.getElementById("loveSong");

    song.play().catch(() => {
        console.log("Please check song.mp3 is in the same folder.");
    });
}

// Floating hearts in the background
const symbols = ["♥", "♡", "💕", "💗"];

for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent = symbols[i % symbols.length];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (5 + Math.random() * 7) + "s";
    heart.style.animationDelay = (Math.random() * 8) + "s";

    document.body.appendChild(heart);
}
</script>

</body>
</html>
